<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stamp Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Every pop-up stamp in the lesson, drawn with the lesson's own stamp code and styles, one phone screen each. */
:root{--felt:#0e4d3e; --felt-2:#082d24; --ink:#f4efe2; --muted:#a9c9bc; --gold:#f6cf6b; --ok:#8af0b4; --bad:#ff7b6e;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0; background:#04140f; color:var(--ink); font:500 14px/1.4 var(--f-mono)}
header{position:sticky; top:0; z-index:5; padding:12px 16px; background:#04140f; border-bottom:1px solid #1d3a31}
header b{font:800 18px/1.2 var(--f-display)} #sum.ok{color:var(--ok)} #sum.bad{color:var(--bad)}
.screen{position:relative; height:46vh; min-height:300px; margin:12px 0 0; background:radial-gradient(130% 80% at 50% 30%, var(--felt), var(--felt-2)); overflow:visible; outline:2px solid #2e6b57}
.screen.over{outline:3px solid var(--bad)}
.tag{position:absolute; left:8px; bottom:6px; font-size:11px; color:var(--muted); z-index:2}
.tag i{font-style:normal; font-weight:700} .screen.over .tag i{color:var(--bad)} .screen:not(.over) .tag i{color:var(--ok)}
.stamps{position:absolute; inset:0; pointer-events:none}
.stamps{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.stamp{position:absolute; left:50%; top:var(--y,24%); translate:-50% 0; text-align:center; white-space:normal; width:max-content; max-width:calc(100% - 28px); text-wrap:balance; font:800 clamp(2rem,10.5vw,4.4rem)/.95 var(--f-display); letter-spacing:-.02em; color:var(--ink); text-shadow:0 6px 28px rgba(0,0,0,.5);
  animation:stampin .45s cubic-bezier(.2,1.7,.4,1) both, stampout .45s ease-in forwards; animation-delay:0s, var(--life)}
.stamp small{display:block; font:700 clamp(.66rem,3vw,.95rem)/1.2 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; margin-top:.55em; opacity:.85}
.stamp.big{font-size:clamp(4rem,24vw,11rem); --y:16%}
.stamp.title{font-size:clamp(3rem,15vw,6.5rem); --y:18%}
.stamp.sm{font-size:clamp(1.4rem,7vw,2.6rem); --y:28%; letter-spacing:.05em}
.stamp.joke{--y:50%; font-size:clamp(1.6rem,8vw,3.2rem); rotate:-5deg}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad); font-size:clamp(1.4rem,7vw,2.6rem)} .stamp.warn{color:var(--gold)}
@keyframes stampin{from{transform:scale(1.9) rotate(-5deg); opacity:0}to{transform:scale(1) rotate(-2deg); opacity:1}}
@keyframes stampout{to{transform:scale(.92) rotate(-2deg); opacity:0}}
</style>
</head>
<body>
<header><b>Every stamp, phone width</b><div id="sum">Checking…</div></header>
<main id="list"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="film.js?v=11"></script>
<script>
(function(){
  const W=window.WSFilm,recs=[];
  /* run every scene's script against a stand-in film that only records the stamps */
  let step='';
  const any=new Proxy(function(){},{get:(t,k)=>k===Symbol.toPrimitive?()=>0:(k==='then'?undefined:any),apply:()=>any,set:()=>true});
  const fake=new Proxy({},{get:(t,k)=>k==='stamp'?(h,c,l,s)=>recs.push({step,h,c:c||'',s:s||''}):(k==='port'?true:any),set:()=>true});
  const realTimeout=window.setTimeout;window.setTimeout=(f)=>{try{f()}catch(e){}return 0};
  W.SCENES.forEach((S,i)=>{step=W.STEPS[i].name;S.cues.forEach(c=>{try{c[1](fake)}catch(e){}});
    (W.TIMING[i].jokes||[]).forEach(j=>{if(!/DARRIN/.test(j[1]))recs.push({step,h:j[1],c:j[2]+' joke',s:''})})});
  window.setTimeout=realTimeout;
  recs.push({step:'Discard order',h:"THROUGH NAN'S<br>FIBRO WALL",c:'bad joke',s:''});
  const list=document.getElementById('list');
  recs.forEach(r=>{
    const sc=document.createElement('section');sc.className='screen';
    sc.innerHTML='<div class="stamps"></div><div class="tag">'+r.step+' · <i>…</i></div>';list.appendChild(sc);
    W.Film.prototype.stamp.call({o:{stamps:sc.firstChild}},r.h,r.c,99999,r.s);
  });
  const check=()=>{let bad=0;
    document.querySelectorAll('.screen').forEach(sc=>{const b=sc.getBoundingClientRect(),d=sc.querySelector('.stamp');if(!d)return;const r=d.getBoundingClientRect();
      const over=r.left<b.left-1||r.right>b.right+1;sc.classList.toggle('over',over);sc.querySelector('i').textContent=over?'off screen':'fits';if(over)bad++});
    const s=document.getElementById('sum');s.textContent=(recs.length-bad)+' of '+recs.length+' stamps fit at '+innerWidth+'px wide';s.className=bad?'bad':'ok'};
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(check,900));
  addEventListener('resize',()=>setTimeout(check,300));
})();
</script>
</body>
</html>
